# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Google Colab Mixin
description: Mixin providing Google Colab CLI, zero-trust OAuth proxy mediation, headless keyring, and colab-operator skill.
version: "1.1.0"

provides:
  - colab

capabilities:
  - type: com.docker.sandbox/agent-skill@1
    config:
      path: /usr/share/colab-mixin/skills/colab-operator
      name: colab-operator
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - colab.research.google.com
          - colab.pa.googleapis.com
          - "**.colab.dev"
          - accounts.google.com
          - oauth2.googleapis.com
          - www.googleapis.com
          - pypi.org
          - files.pythonhosted.org
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Google Colab OAuth credential exchange
    config:
      service: google-colab
      phase: runtime
      oauth:
        tokenEndpoint:
          host: accounts.google.com
          path: /o/oauth2/token
        resourceHosts:
          - colab.research.google.com
          - colab.pa.googleapis.com
        sentinels:
          accessToken: colab-at-proxy-managed
          refreshToken: colab-rt-proxy-managed
        credentialFile:
          path: ~/.config/colab-cli/token.json
          structure:
            token: "{{.AccessToken}}"
            refresh_token: "{{.RefreshToken}}"
            token_uri: https://accounts.google.com/o/oauth2/token
            expiry: "2000-01-01T00:00:00Z"
